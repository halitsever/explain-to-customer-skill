<section class="scene scene--screenshot-callouts" data-scene="{{id}}">
  <h2 class="h-scene" data-anim data-fit data-max-lines="2" data-min="64">{{heading}}</h2>
  <div class="shot-layout">
    <div class="shot" data-anim>{{image}}</div>
    <ol class="callouts">{{callouts}}</ol>
  </div>
</section>
