<section class="scene scene--before-after" data-scene="{{id}}">
  <h2 class="h-scene" data-anim data-fit data-max-lines="2" data-min="64">{{heading}}</h2>
  <div class="ba">
    <div class="card card--before" data-anim>
      <span class="pill pill--before">{{beforeIcon}}<span>{{beforeLabel}}</span></span>
      <p class="text" data-fit data-max-lines="5" data-min="36">{{beforeText}}</p>
      {{beforeImage}}
    </div>
    <div class="arrow" data-anim>{{arrowIcon}}</div>
    <div class="card card--after" data-anim>
      <span class="pill pill--after">{{afterIcon}}<span>{{afterLabel}}</span></span>
      <p class="text" data-fit data-max-lines="5" data-min="36">{{afterText}}</p>
      {{afterImage}}
    </div>
  </div>
</section>
