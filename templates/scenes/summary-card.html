<section class="scene scene--summary-card" data-scene="{{id}}">
  <div class="eyebrow"><span class="dot"></span><span>{{eyebrow}}</span></div>
  <h1 class="h-scene" data-fit data-max-lines="2" data-min="64">{{heading}}</h1>
  <div class="summary">
    <div class="left">
      <ul class="points">{{points}}</ul>
      <div class="card action-box">
        <div class="label">{{actionLabel}}</div>
        <p class="text" data-fit data-max-lines="3" data-min="36">{{actionText}}</p>
      </div>
    </div>
    <div class="visual">{{visual}}</div>
  </div>
</section>
